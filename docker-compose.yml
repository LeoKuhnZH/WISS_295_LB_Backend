services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - data:/var/lib/mysql
      - ./src/main/resources/initdb/:/docker-entrypoint-initdb.d/:ro

volumes:
  data:
